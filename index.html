<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sümeyye Önal - Bilgisayar Ağları DNS Ödevi</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: #ffffff;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            max-width: 440px;
            width: 90%;
            text-align: center;
        }
        h1 {
            color: #1a202c;
            margin-bottom: 8px;
            font-size: 24px;
        }
        .badge {
            background-color: #e2e8f0;
            color: #4a5568;
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
        }
        p {
            color: #718096;
            line-height: 1.6;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">Bilgisayar Ağları Dersi</span>
        <h1>Sümeyye Önal</h1>
        <p>
            Bu web sayfası, alan adı yönetimi ve temel DNS kayıtlarının 
            (A, CNAME, MX, NS) yapılandırılmasını uygulamalı olarak 
            göstermek amacıyla hazırlanmıştır.
        </p>
    </div>
</body>
</html>
